<title>제갈량 상소문</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@600;700;900&family=Noto+Sans+KR:wght@300;400;500&display=swap">

<style>
  :root {
    --bg: #f0ebe0;
    --bg-alt: #e8e1d2;
    --bg-card: #f8f4ec;
    --text: #2a2722;
    --text-heading: #1a1815;
    --text-dim: #6d645a;
    --text-faint: #9a9088;
    --accent: #b83a28;
    --gold: #b08a30;
    --gold-hi: #d4a83e;
    --rule: #d0c4ae;
    --rule-faint: #ddd2be;
    --seal-glow: rgba(184,58,40,0.15);
    --shadow: rgba(26,24,21,0.08);
    --shadow-md: rgba(26,24,21,0.14);
    --sky-top: #bccfe2;
    --sky-bot: #ddd6c8;
    --mtn-far: #c4bbb0;
    --mtn-mid: #b0a89c;
    --mtn-near: #9e9688;
    --court: #ccc4b4;
    --court-line: #bab2a2;
    --stone: #a09888;
    --stone-hi: #b8b0a0;
    --cloud: rgba(255,255,255,0.5);
    --fog: rgba(240,235,224,0.5);
    --bubble-bg: #fefcf6;
    --bubble-border: #ddd6c8;
    --mbubble-bg: #faf6ee;
    --mbubble-border: #e0d8ca;
    --skin: #e8c9a0;
    --skin-shade: #d4a574;
    --modal-bg: #f8f4ec;
    --modal-border: #d8d0c0;
    --overlay: rgba(20,18,15,0.55);
  }

  @media(prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#131210;--bg-alt:#1a1916;--bg-card:#201f1c;--text:#ccc4b4;--text-heading:#e4dcd0;
      --text-dim:#a09888;--text-faint:#686058;--accent:#d04a38;--gold:#c49a3e;--gold-hi:#dab04a;
      --rule:#302c26;--rule-faint:#282520;--seal-glow:rgba(208,74,56,0.2);
      --shadow:rgba(0,0,0,0.3);--shadow-md:rgba(0,0,0,0.4);
      --sky-top:#0e0d0c;--sky-bot:#161514;--mtn-far:#1c1b18;--mtn-mid:#181716;
      --mtn-near:#201f1c;--court:#181716;--court-line:#222120;
      --stone:#282624;--stone-hi:#302e2c;--cloud:rgba(40,38,36,0.5);
      --fog:rgba(19,18,16,0.5);
      --bubble-bg:#1c1b18;--bubble-border:#302c26;
      --mbubble-bg:#1a1918;--mbubble-border:#2a2826;
      --skin:#c8a880;--skin-shade:#a88060;
      --modal-bg:#201f1c;--modal-border:#333028;--overlay:rgba(0,0,0,0.65);
    }
  }
  :root[data-theme="dark"]{
    --bg:#131210;--bg-alt:#1a1916;--bg-card:#201f1c;--text:#ccc4b4;--text-heading:#e4dcd0;
    --text-dim:#a09888;--text-faint:#686058;--accent:#d04a38;--gold:#c49a3e;--gold-hi:#dab04a;
    --rule:#302c26;--rule-faint:#282520;--seal-glow:rgba(208,74,56,0.2);
    --shadow:rgba(0,0,0,0.3);--shadow-md:rgba(0,0,0,0.4);
    --sky-top:#0e0d0c;--sky-bot:#161514;--mtn-far:#1c1b18;--mtn-mid:#181716;
    --mtn-near:#201f1c;--court:#181716;--court-line:#222120;
    --stone:#282624;--stone-hi:#302e2c;--cloud:rgba(40,38,36,0.5);
    --fog:rgba(19,18,16,0.5);
    --bubble-bg:#1c1b18;--bubble-border:#302c26;
    --mbubble-bg:#1a1918;--mbubble-border:#2a2826;
    --skin:#c8a880;--skin-shade:#a88060;
    --modal-bg:#201f1c;--modal-border:#333028;--overlay:rgba(0,0,0,0.65);
  }

  body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;line-height:1.8;min-height:100vh;padding-block:0}

  /* ── Scene ── */
  .scene-wrap{background:var(--bg);overflow:hidden}
  .scene{position:relative;max-width:960px;margin:0 auto}
  .scene-svg{width:100%;height:auto;display:block}

  .zl-bubble{
    position:absolute;top:1%;left:50%;transform:translateX(-50%);
    background:var(--bubble-bg);border:1.5px solid var(--bubble-border);
    border-radius:18px;padding:16px 24px 12px;max-width:340px;min-width:200px;
    text-align:center;box-shadow:0 6px 24px var(--shadow-md);z-index:12;
  }
  .zl-bubble::before{
    content:'';position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);
    border:14px solid transparent;border-top-color:var(--bubble-border);
  }
  .zl-bubble::after{
    content:'';position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);
    border:13px solid transparent;border-top-color:var(--bubble-bg);
  }
  .zl-bubble .b-text{
    font-family:'Gowun Batang',serif;font-size:14px;line-height:1.75;
    color:var(--text);margin:0 0 6px;
  }
  .zl-bubble .b-attr{
    font-weight:300;font-size:11px;color:var(--text-faint);letter-spacing:1px;
  }

  .m-bubble{
    position:absolute;
    background:var(--mbubble-bg);border:1px solid var(--mbubble-border);
    border-radius:14px;padding:8px 14px;max-width:170px;
    text-align:center;box-shadow:0 3px 12px var(--shadow);z-index:11;
    font-size:13px;line-height:1.6;color:var(--text-dim);
  }
  .m-bubble::before{
    content:'';position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);
    border:9px solid transparent;border-top-color:var(--mbubble-border);
  }
  .m-bubble::after{
    content:'';position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
    border:8px solid transparent;border-top-color:var(--mbubble-bg);
  }
  .m-bubble .m-name{display:block;font-size:10px;color:var(--text-faint);margin-top:4px;letter-spacing:0.5px}
  .m1{left:2%;top:54%}
  .m2{left:19%;top:44%}
  .m3{right:19%;top:44%}
  .m4{right:2%;top:54%}

  /* ── Title ── */
  .title-area{text-align:center;padding:28px 20px 36px;background:var(--bg)}
  .title-date{font-weight:300;font-size:12px;letter-spacing:3px;color:var(--text-dim);margin-bottom:10px}
  .title-area h1{
    font-family:'Noto Serif KR',serif;font-weight:900;font-size:48px;
    letter-spacing:10px;color:var(--text-heading);margin:0;text-wrap:balance;
  }
  .title-sub{font-weight:300;font-size:14px;color:var(--text-dim);margin:10px 0 0;letter-spacing:1px}

  /* ── Body ── */
  .scroll-body{max-width:680px;margin:0 auto;padding:0 28px 80px}

  .opening{margin-bottom:48px}
  .opening p{margin:0 0 14px;font-size:16px}
  .opening .greeting{
    font-family:'Noto Serif KR',serif;font-weight:700;font-size:20px;
    color:var(--text-heading);margin-bottom:18px;
  }

  .section{margin-bottom:48px}
  .section-head{text-align:center;margin-bottom:36px}
  .section-label{font-weight:300;font-size:11px;letter-spacing:4px;color:var(--accent);display:block;margin-bottom:8px}
  .section-head h2{font-family:'Noto Serif KR',serif;font-weight:700;font-size:24px;color:var(--text-heading);margin:0;text-wrap:balance}
  .section-head .hanja{font-weight:600;font-size:0.8em;color:var(--text-dim);margin-left:2px}
  .section-desc{font-weight:300;font-size:13px;color:var(--text-faint);margin:8px 0 0}
  .section-head::after{content:'';display:block;width:36px;height:1px;background:var(--gold);margin:18px auto 0;opacity:0.5}
  .section-intro{margin:0 0 28px;font-size:16px;color:var(--text-dim);line-height:1.85}

  .point{margin-bottom:24px;padding:20px 24px;background:var(--bg-alt);border-radius:12px;border-left:3px solid var(--gold)}
  .point-title{font-family:'Noto Serif KR',serif;font-weight:700;font-size:17px;color:var(--text-heading);margin:0 0 10px}
  .point p{margin:0;font-size:16px;line-height:1.85}

  .ink-divider{text-align:center;padding:24px 0 40px}
  .ink-divider svg{width:min(320px,70%);height:20px}

  .closing{text-align:center;padding-top:24px;border-top:1px solid var(--rule-faint)}
  .closing-text{font-size:16px;margin:0 0 36px;line-height:2}
  .seal-area{display:inline-block;transform:rotate(-7deg);filter:drop-shadow(0 0 12px var(--seal-glow));margin-bottom:28px}
  .seal-box{
    width:84px;height:84px;border:3px solid var(--accent);
    display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;
  }
  .seal-box::before{content:'';position:absolute;inset:5px;border:1px solid var(--accent);opacity:0.5}
  .seal-char{font-family:'Noto Serif KR',serif;font-weight:900;font-size:24px;color:var(--accent);line-height:1.15}
  .closing-date{font-weight:300;font-size:12px;color:var(--text-faint);letter-spacing:2px}
  .closing-note{font-weight:300;font-size:11px;color:var(--text-faint);margin-top:40px;padding-top:20px;border-top:1px solid var(--rule-faint);line-height:1.7;opacity:0.7}

  /* ── Strategy section ── */
  .strategy-overview{margin:0 0 32px;font-size:16px;color:var(--text-dim);line-height:1.85;padding:16px 20px;background:var(--bg-alt);border-radius:12px;border-left:3px solid var(--accent)}
  .strategy-steps{position:relative;padding-left:48px}
  .strategy-step{position:relative;margin-bottom:28px;padding:20px 24px;background:var(--bg-alt);border-radius:12px}
  .strategy-step::before{
    content:'';position:absolute;left:-32px;top:0;bottom:-28px;width:2px;background:var(--gold);opacity:0.3;
  }
  .strategy-step:last-child::before{display:none}
  .step-num{
    position:absolute;left:-44px;top:18px;width:28px;height:28px;
    border-radius:50%;background:var(--gold);color:#fff;
    font-family:'Noto Serif KR',serif;font-weight:700;font-size:13px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px var(--shadow);z-index:1;
  }
  .step-title{font-family:'Noto Serif KR',serif;font-weight:700;font-size:17px;color:var(--text-heading);margin:0 0 10px}
  .step-body{margin:0 0 10px;font-size:16px;line-height:1.85}
  .step-caution{
    margin:0;padding:8px 14px;font-size:14px;line-height:1.7;
    color:var(--accent);background:rgba(184,58,40,0.06);
    border-left:2px solid var(--accent);border-radius:0 8px 8px 0;
  }
  .strategy-summary{
    text-align:center;margin-top:8px;padding:16px 24px;
    border:1.5px solid var(--gold);border-radius:12px;
    font-family:'Gowun Batang',serif;font-size:16px;line-height:1.8;
    color:var(--text-heading);opacity:0.9;
  }

  @media(max-width:640px){
    .strategy-steps{padding-left:40px}
    .step-num{left:-36px;width:24px;height:24px;font-size:12px;top:16px}
    .strategy-step::before{left:-24px}
    .strategy-step{padding:16px 18px}
    .step-title{font-size:16px}
    .step-body,.strategy-overview{font-size:15px}
    .step-caution{font-size:13px}
  }

  /* ── Topic button + Modal ── */
  .topic-btn{
    position:fixed;bottom:28px;right:28px;z-index:100;
    background:var(--gold);color:#fff;border:none;border-radius:50px;
    padding:14px 24px;font-family:'Noto Sans KR',sans-serif;font-weight:500;font-size:14px;
    cursor:pointer;box-shadow:0 4px 16px var(--shadow-md);
    transition:transform 0.15s,box-shadow 0.15s;
  }
  .topic-btn:hover{transform:translateY(-2px);box-shadow:0 6px 24px var(--shadow-md)}
  .topic-btn:active{transform:translateY(0)}
  .reset-btn{right:auto;left:28px;background:var(--bg-alt);color:var(--text-dim);border:1.5px solid var(--modal-border)}
  .reset-btn:hover{background:var(--rule-faint)}

  .modal-overlay{
    position:fixed;inset:0;z-index:200;background:var(--overlay);
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .modal{
    background:var(--modal-bg);border:1px solid var(--modal-border);
    border-radius:16px;padding:32px;max-width:520px;width:100%;
    box-shadow:0 20px 60px var(--shadow-md);
  }
  .modal h3{
    font-family:'Noto Serif KR',serif;font-weight:700;font-size:20px;
    color:var(--text-heading);margin:0 0 8px;
  }
  .modal .modal-desc{font-size:14px;color:var(--text-dim);margin:0 0 20px}
  .modal textarea{
    width:100%;min-height:120px;padding:14px 16px;border:1px solid var(--modal-border);
    border-radius:10px;background:var(--bg);color:var(--text);
    font-family:'Noto Sans KR',sans-serif;font-size:15px;line-height:1.7;
    resize:vertical;box-sizing:border-box;
  }
  .modal textarea:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:var(--gold)}
  .modal-actions{display:flex;gap:12px;margin-top:20px;justify-content:flex-end}
  .modal-actions button{
    padding:10px 24px;border-radius:10px;font-family:'Noto Sans KR',sans-serif;
    font-size:14px;font-weight:500;cursor:pointer;border:none;
  }
  .btn-gen{background:var(--gold);color:#fff}
  .btn-gen:hover{background:var(--gold-hi)}
  .btn-gen:disabled{opacity:0.5;cursor:not-allowed}
  .btn-cancel{background:var(--bg-alt);color:var(--text-dim);border:1px solid var(--modal-border) !important}
  .btn-cancel:hover{background:var(--rule-faint)}
  .gen-status{margin-top:20px;padding:16px;background:var(--bg-alt);border-radius:10px}
  .gen-status p{margin:0;font-size:13px;color:var(--text-dim);line-height:1.6}
  .gen-bar{height:3px;background:var(--rule);border-radius:2px;margin-bottom:10px;overflow:hidden}
  .gen-bar-fill{height:100%;background:var(--gold);border-radius:2px;animation:genpulse 1.8s ease-in-out infinite;width:40%}
  @keyframes genpulse{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  .topic-badge{
    display:inline-block;background:var(--bg-alt);border:1px solid var(--rule-faint);
    border-radius:20px;padding:4px 14px;font-size:12px;color:var(--text-dim);
    margin-top:8px;
  }

  @media(max-width:640px){
    .title-area h1{font-size:36px;letter-spacing:6px}
    .zl-bubble{max-width:260px;padding:12px 16px 10px;top:0}
    .zl-bubble .b-text{font-size:13px}
    .m-bubble{max-width:120px;font-size:11px;padding:6px 10px}
    .m1{left:1%;top:56%} .m2{left:14%;top:46%}
    .m3{right:14%;top:46%} .m4{right:1%;top:56%}
    .scroll-body{padding:0 16px 60px}
    .section-head h2{font-size:20px}
    .point{padding:16px 18px}
    .point-title{font-size:16px}
    .point p,.opening p,.section-intro,.closing-text{font-size:15px}
    .topic-btn{bottom:16px;right:16px;padding:12px 20px;font-size:13px}
    .reset-btn{right:auto;left:16px}
    .modal{padding:24px}
  }

  @media(prefers-reduced-motion:reduce){.cloud-drift,.fog-drift,.gen-bar-fill{animation:none !important}}
  .cloud-drift{animation:cdrift 28s ease-in-out infinite}
  .cloud-drift:nth-child(2){animation-delay:-12s;animation-duration:34s}
  @keyframes cdrift{0%,100%{transform:translateX(0)}50%{transform:translateX(20px)}}
  .fog-drift{animation:fdrift 22s ease-in-out infinite}
  @keyframes fdrift{0%,100%{transform:translateX(0);opacity:0.4}50%{transform:translateX(30px);opacity:0.6}}
</style>

<!-- ═══════ Scene ═══════ -->
<div class="scene-wrap">
  <div class="scene">
    <svg class="scene-svg" viewBox="0 0 960 560" preserveAspectRatio="xMidYMid meet" aria-label="제갈량이 신하들 앞에서 우선을 들고 서 있는 장면">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--sky-top)"/>
          <stop offset="1" stop-color="var(--sky-bot)"/>
        </linearGradient>
        <linearGradient id="zl-robe" x1=".3" y1="0" x2=".7" y2="1">
          <stop offset="0" stop-color="#4a7a9a"/><stop offset="1" stop-color="#2a5a7a"/>
        </linearGradient>
        <linearGradient id="zl-robe2" x1=".5" y1="0" x2=".5" y2="1">
          <stop offset="0" stop-color="#3a6a8a"/><stop offset="1" stop-color="#1e4a6a"/>
        </linearGradient>
        <linearGradient id="zl-hat" x1=".5" y1="0" x2=".5" y2="1">
          <stop offset="0" stop-color="#3d5a80"/><stop offset="1" stop-color="#1e3a5e"/>
        </linearGradient>
        <linearGradient id="m1robe" x1=".3" y1="0" x2=".7" y2="1">
          <stop offset="0" stop-color="#9a4a4a"/><stop offset="1" stop-color="#7a3030"/>
        </linearGradient>
        <linearGradient id="m2robe" x1=".3" y1="0" x2=".7" y2="1">
          <stop offset="0" stop-color="#3a7a4a"/><stop offset="1" stop-color="#2a5a3a"/>
        </linearGradient>
        <linearGradient id="m3robe" x1=".3" y1="0" x2=".7" y2="1">
          <stop offset="0" stop-color="#5a3a7a"/><stop offset="1" stop-color="#402a5a"/>
        </linearGradient>
        <linearGradient id="m4robe" x1=".3" y1="0" x2=".7" y2="1">
          <stop offset="0" stop-color="#8a7040"/><stop offset="1" stop-color="#6a5030"/>
        </linearGradient>
        <radialGradient id="sun-glow" cx=".5" cy=".3" r=".5">
          <stop offset="0" stop-color="rgba(255,220,180,0.15)"/>
          <stop offset="1" stop-color="rgba(255,220,180,0)"/>
        </radialGradient>
      </defs>

      <rect width="960" height="560" fill="url(#sky)"/>
      <rect width="960" height="400" fill="url(#sun-glow)"/>

      <g class="cloud-drift" fill="var(--cloud)">
        <ellipse cx="140" cy="70" rx="60" ry="20"/><ellipse cx="168" cy="58" rx="45" ry="16"/><ellipse cx="112" cy="62" rx="38" ry="14"/>
      </g>
      <g class="cloud-drift" fill="var(--cloud)" opacity="0.7">
        <ellipse cx="760" cy="50" rx="55" ry="18"/><ellipse cx="790" cy="40" rx="40" ry="14"/><ellipse cx="730" cy="44" rx="32" ry="12"/>
      </g>
      <g class="cloud-drift" fill="var(--cloud)" opacity="0.4" style="animation-delay:-18s;animation-duration:40s">
        <ellipse cx="460" cy="35" rx="42" ry="12"/><ellipse cx="485" cy="28" rx="30" ry="10"/>
      </g>

      <path d="M0,310 C50,295 100,258 180,235 C260,212 320,245 400,240 C480,235 530,195 640,175 C720,162 790,195 870,185 C920,180 950,205 960,215 L960,560 L0,560Z" fill="var(--mtn-far)"/>
      <g fill="var(--mtn-mid)" opacity="0.5">
        <g transform="translate(640,170)"><polygon points="-5,3 0,-9 5,3"/><polygon points="-4,8 0,-1 4,8"/><rect x="-0.8" y="8" width="1.6" height="6"/></g>
        <g transform="translate(652,176)"><polygon points="-3.5,2 0,-6 3.5,2"/><polygon points="-3,6 0,0 3,6"/><rect x="-0.5" y="6" width="1" height="5"/></g>
        <g transform="translate(875,180)"><polygon points="-4,2.5 0,-7 4,2.5"/><polygon points="-3.5,7 0,-0.5 3.5,7"/><rect x="-0.6" y="7" width="1.2" height="5"/></g>
        <g transform="translate(185,230)"><polygon points="-4,3 0,-8 4,3"/><polygon points="-3,7 0,0 3,7"/><rect x="-0.6" y="7" width="1.2" height="5"/></g>
      </g>
      <g stroke="var(--mtn-far)" fill="none" stroke-width="1.2" opacity="0.18">
        <path d="M340,105 Q347,98 354,105"/><path d="M354,105 Q361,98 368,105"/>
        <path d="M385,118 Q390,113 395,118"/><path d="M395,118 Q400,113 405,118"/>
        <path d="M375,128 Q378,125 381,128"/><path d="M381,128 Q384,125 387,128"/>
      </g>
      <path d="M0,370 C80,345 160,315 260,305 C360,295 420,325 520,315 C620,305 700,275 820,278 C900,280 950,305 960,315 L960,560 L0,560Z" fill="var(--mtn-mid)"/>
      <path d="M0,400 C100,385 200,370 320,365 C440,360 520,378 640,373 C760,368 870,380 960,388 L960,560 L0,560Z" fill="var(--mtn-near)"/>
      <g class="fog-drift">
        <ellipse cx="200" cy="385" rx="180" ry="18" fill="var(--fog)"/>
        <ellipse cx="700" cy="378" rx="160" ry="15" fill="var(--fog)"/>
      </g>
      <rect x="0" y="418" width="960" height="142" fill="var(--court)"/>
      <line x1="0" y1="418" x2="960" y2="418" stroke="var(--court-line)" stroke-width="1.5"/>
      <g stroke="var(--court-line)" stroke-width="0.4" opacity="0.3">
        <line x1="0" y1="450" x2="960" y2="450"/>
        <line x1="0" y1="490" x2="960" y2="490"/>
        <line x1="0" y1="530" x2="960" y2="530"/>

    m4: ['허허, 지당하신 말씀이오','노신도 동감하오이다','세월이 증명하는 진리요','깊이 공감하오','경험에서 우러나온 지혜...','참으로 그러하오','오래 살아도 배움이 있소','명심하고 또 명심하리다']
  };

  // ── Date rendering ──
  var stems = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  var branches = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  var mNames = ['','正','二','三','四','五','六','七','八','九','十','十一','十二'];
  function cn(n){var c=['','一','二','三','四','五','六','七','八','九','十'];if(n<=10)return c[n];if(n<20)return'十'+c[n-10];if(n===20)return'二十';if(n<30)return'二十'+c[n-20];if(n===30)return'三十';return'三十'+c[n-30]}

  var d = new Date(), y = d.getFullYear();
  var dateStr = stems[(y-4)%10]+branches[(y-4)%12]+'年 '+mNames[d.getMonth()+1]+'月 '+cn(d.getDate())+'日';
  var dayOfYear = Math.floor((d - new Date(y,0,0)) / 864e5);

  document.getElementById('heroDate').textContent = dateStr;
  document.getElementById('closingDate').textContent = dateStr + ' 臥龍 諸葛亮 拜上';

  // ── Validation helpers ──
  function validSec(s) { return s && s.points && s.points.length > 0; }
  function validStrat(s) { return s && s.steps && s.steps.length > 0; }

  // ── Render content ──
  function renderContent(data) {
    document.getElementById('greetingEl').textContent = data.greeting || DEFAULT.greeting;
    document.getElementById('openingEl').textContent = data.opening || DEFAULT.opening;

    var badge = document.getElementById('topicBadge');
    if (data.topic) { badge.textContent = data.topic; badge.hidden = false; }
    else { badge.hidden = true; }

    renderSection('s1', validSec(data.section1) ? data.section1 : DEFAULT.section1);
    renderSection('s2', validSec(data.section2) ? data.section2 : DEFAULT.section2);
    renderStrategy(validStrat(data.strategy) ? data.strategy : DEFAULT.strategy);

    var closingEl = document.getElementById('closingText');
    closingEl.innerHTML = data.closing || DEFAULT.closing;

    var quotes = data.quotes && data.quotes.length ? data.quotes : DEFAULT.quotes;
    document.getElementById('quoteText').textContent = quotes[dayOfYear % quotes.length];

    var sets = [
      {id:'m1Text', arr: data.m1 && data.m1.length ? data.m1 : DEFAULT.m1},
      {id:'m2Text', arr: data.m2 && data.m2.length ? data.m2 : DEFAULT.m2},
      {id:'m3Text', arr: data.m3 && data.m3.length ? data.m3 : DEFAULT.m3},
      {id:'m4Text', arr: data.m4 && data.m4.length ? data.m4 : DEFAULT.m4}
    ];
    sets.forEach(function(s){ document.getElementById(s.id).textContent = s.arr[dayOfYear % s.arr.length]; });
  }

  function renderSection(prefix, sec) {
    document.getElementById(prefix+'Label').textContent = sec.label || '';
    var titleEl = document.getElementById(prefix+'Title');
    titleEl.innerHTML = '';
    titleEl.appendChild(document.createTextNode(sec.title || ''));
    if (sec.hanja) {
      var span = document.createElement('span');
      span.className = 'hanja';
      span.textContent = sec.hanja;
      titleEl.appendChild(span);
    }
    document.getElementById(prefix+'Desc').textContent = sec.desc || '';
    document.getElementById(prefix+'Intro').textContent = sec.intro || '';

    var container = document.getElementById(prefix+'Points');
    container.innerHTML = '';
    (sec.points || []).forEach(function(pt) {
      var div = document.createElement('div');
      div.className = 'point';
      var h = document.createElement('p');
      h.className = 'point-title';
      h.textContent = pt.title;
      var p = document.createElement('p');
      p.textContent = pt.body;
      div.appendChild(h);
      div.appendChild(p);
      container.appendChild(div);
    });
  }

  function renderStrategy(strat) {
    if (!strat) strat = DEFAULT.strategy;
    document.getElementById('s3Label').textContent = strat.label || '第三章';
    var titleEl = document.getElementById('s3Title');
    titleEl.innerHTML = '';
    titleEl.appendChild(document.createTextNode(strat.title || ''));
    if (strat.hanja) {
      var span = document.createElement('span');
      span.className = 'hanja';
      span.textContent = strat.hanja;
      titleEl.appendChild(span);
    }
    document.getElementById('s3Desc').textContent = strat.desc || '';
    document.getElementById('s3Overview').textContent = strat.overview || '';

    var container = document.getElementById('s3Steps');
    container.innerHTML = '';
    (strat.steps || []).forEach(function(step, i) {
      var div = document.createElement('div');
      div.className = 'strategy-step';
      var num = document.createElement('span');
      num.className = 'step-num';
      num.textContent = i + 1;
      div.appendChild(num);
      var h = document.createElement('p');
      h.className = 'step-title';
      h.textContent = (step.phase ? step.phase + ': ' : '') + step.title;
      div.appendChild(h);
      var body = document.createElement('p');
      body.className = 'step-body';
      body.textContent = step.body;
      div.appendChild(body);
      if (step.caution) {
        var caut = document.createElement('p');
        caut.className = 'step-caution';
        caut.textContent = step.caution;
        div.appendChild(caut);
      }
      container.appendChild(div);
    });

    document.getElementById('s3Summary').textContent = strat.summary || '';
  }

  // ── Initial render with default ──
  renderContent(DEFAULT);

  // ── Capabilities init ──
  if (window.claude) {
    Promise.all([
      window.claude.use('sample').catch(function(){ return null; }),
      window.claude.use('db').catch(function(){ return null; })
    ]).then(function(caps) {
      var sampleCap = caps[0], dbCap = caps[1];

      if (dbCap) {
        dbCap.doc('content/current').get().then(function(snap) {
          if (snap.exists) {
            var saved = snap.data();
            if (validSec(saved.section1) || validSec(saved.section2) || saved.greeting) {
              renderContent(saved);
              document.getElementById('resetBtn').hidden = false;
            }
          }
        }).catch(function(){});
      }

      document.getElementById('resetBtn').onclick = function() {
        renderContent(DEFAULT);
        document.getElementById('resetBtn').hidden = true;
      };

      if (sampleCap) {
        var btn = document.getElementById('topicBtn');
        btn.hidden = false;

        btn.onclick = function() {
          document.getElementById('modalOverlay').hidden = false;
          document.getElementById('topicInput').value = '';
          document.getElementById('genStatus').hidden = true;
          document.getElementById('generateBtn').disabled = false;
          document.getElementById('topicInput').focus();
        };

        document.getElementById('cancelBtn').onclick = function() {
          document.getElementById('modalOverlay').hidden = true;
          if (currentCtl) currentCtl.abort();
        };

        document.getElementById('modalOverlay').onclick = function(e) {
          if (e.target === document.getElementById('modalOverlay')) {
            document.getElementById('modalOverlay').hidden = true;
            if (currentCtl) currentCtl.abort();
          }
        };

        var currentCtl = null;
        document.getElementById('generateBtn').onclick = function() {
          var topic = document.getElementById('topicInput').value.trim();
          if (!topic) return;

          document.getElementById('generateBtn').disabled = true;
          document.getElementById('genStatus').hidden = false;
          document.getElementById('genText').textContent = '제갈량이 생각하는 중...';

          currentCtl = new AbortController();

          var prompt = '당신은 제갈량(諸葛亮)입니다. 삼국지 시대의 전설적인 전략가이자 승상으로서, 현대인에게 조언하는 상소문을 작성합니다.\n\n'
            + '[주제]: ' + topic + '\n\n'
            + '다음 JSON 형식으로만 응답하세요. 다른 텍스트 없이 JSON만 출력하세요:\n'
            + '{\n'
            + '  "greeting": "인사말 (1문장, 해요체)",\n'
            + '  "opening": "도입부 (3-4문장, 해요체, 오늘의 주제를 소개)",\n'
            + '  "section1": {\n'
            + '    "label": "第一章",\n'
            + '    "title": "섹션1 제목 (주제의 실용적/기술적 측면)",\n'
            + '    "hanja": "(한자 부제)",\n'
            + '    "desc": "간단한 설명 (1문장)",\n'
            + '    "intro": "섹션 도입 (2-3문장)",\n'
            + '    "points": [\n'
            + '      {"title": "첫째, ...", "body": "상세 설명 (3-5문장, 비유와 예시 포함)"},\n'
            + '      ... (총 5개)\n'
            + '    ]\n'
            + '  },\n'
            + '  "section2": {\n'
            + '    "label": "第二章",\n'
            + '    "title": "섹션2 제목 (주제의 인생/철학적 측면)",\n'
            + '    "hanja": "(한자 부제)",\n'
            + '    "desc": "간단한 설명 (1문장)",\n'
            + '    "intro": "섹션 도입 (2-3문장)",\n'
            + '    "points": [\n'
            + '      {"title": "첫째, ...", "body": "상세 설명 (3-5문장, 삼국지 일화 연결)"},\n'
            + '      ... (총 7개)\n'
            + '    ]\n'
            + '  },\n'
            + '  "strategy": {\n'
            + '    "label": "第三章",\n'
            + '    "title": "전략 계획 제목 (주제에 맞는 구체적 실행 계획)",\n'
            + '    "hanja": "(한자 부제)",\n'
            + '    "desc": "간단한 설명 (1문장)",\n'
            + '    "overview": "전략 전체 그림 설명 (2-3문장, 왜 이 전략이 필요한지)",\n'
            + '    "steps": [\n'
            + '      {"phase": "1단계", "title": "단계 제목", "body": "구체적 실행 방법 (3-5문장)", "caution": "주의할 점 (1-2문장, 삼국지 실패 사례 참조)"},\n'
            + '      ... (총 5단계)\n'
            + '    ],\n'
            + '    "summary": "전략 핵심 요약 (1-2문장, 단계 흐름을 한 줄로)"\n'
            + '  },\n'
            + '  "closing": "마무리 인사 (HTML <br> 태그로 줄바꿈, 따뜻한 격려)",\n'
            + '  "quotes": ["명언1", "명언2", ... (총 15개, 주제 관련 제갈량 스타일 격언)],\n'
            + '  "m1": ["장수의 충성스러운 반응 8개"],\n'
            + '  "m2": ["참모1의 사려깊은 반응 8개"],\n'
            + '  "m3": ["참모2의 활기찬 반응 8개"],\n'
            + '  "m4": ["원로대신의 어르신 말투 반응 8개"]\n'
            + '}\n\n'
            + '규칙:\n'
            + '- 해요체로 초등학생도 이해할 수 있게 쉽게 작성\n'
            + '- 총 본문 5000자 이상\n'
            + '- 삼국지 시대 일화와 현대 비유를 섞어서 생생하게\n'
            + '- 각 포인트의 body는 반드시 3문장 이상\n'
            + '- strategy의 각 step은 구체적이고 바로 실행 가능한 내용으로 작성\n'
            + '- strategy의 caution은 삼국지에서 실패한 사례나 교훈을 참조\n'
            + '- strategy의 5단계는 순서대로 실행할 수 있게 자연스러운 흐름으로\n'
            + '- closing의 줄바꿈에는 <br> HTML 태그 사용';

          sampleCap.json(prompt, {
            signal: currentCtl.signal,
            cache: false,
            onText: function(u) {
              var preview = u.text.length > 80 ? u.text.slice(0, 80) + '...' : u.text;
              document.getElementById('genText').textContent = '작성 중: ' + preview;
            }
          }).then(function(data) {
            data.topic = topic;

            if (dbCap) {
              dbCap.doc('content/current').set(data).catch(function(){});
            }

            renderContent(data);
            document.getElementById('resetBtn').hidden = false;
            document.getElementById('modalOverlay').hidden = true;
          }).catch(function(e) {
            if (e.code === 'cancelled') return;
            document.getElementById('genText').textContent =
              e.code === 'not_granted' ? '클로드 사용이 허용되지 않았습니다.' :
              e.code === 'rate_limited' ? '요청이 너무 많습니다. 잠시 후 다시 시도해주세요.' :
              '오류가 발생했습니다. 다시 시도해주세요.';
            document.getElementById('generateBtn').disabled = false;
          });
        };
      }
    });
  }
})();
</script>
